<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      // The new site used to live under /new/, and the old site had a few pages the new one merged.
      // Send those old addresses to the right page instead of showing "not found".
      var path = window.location.pathname, rest = window.location.search + window.location.hash;
      if (path.indexOf("/new/") !== -1) {
        window.location.replace(path.replace("/new/", "/") + rest);
      } else if (/\/(about|plo|ilo)\.html$/.test(path)) {
        var to = { about: "olympiad.html", plo: "olympiad.html#plo", ilo: "olympiad.html#iol" }[path.match(/(about|plo|ilo)\.html$/)[1]];
        window.location.replace(path.replace(/[^\/]*$/, "") + to);
      } else {
        window.location.replace(path.replace(/[^\/]*$/, "") + "index.html");
      }
    })();
  </script>
  <title>Panini Linguistics Olympiad</title>
</head>
<body></body>
</html>
